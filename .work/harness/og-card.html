<!DOCTYPE html>
<!-- OG share card — rendered to assets/og/card-{en,zh}.png by og-render.mjs.
     One frame of film: sprocket strips top and bottom (same radial-gradient
     trick the site's .film edges use), the hero line in the middle, the editor
     rising from the bottom edge. ?lang=zh swaps the copy and the lang attr so
     the Han glyphs resolve through the same WenKai subset the site ships.
     Everything is sized for exactly 1200×630 — the OG/Twitter reference size —
     so text stays legible when platforms downscale the card. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: "LXGW WenKai GB";
    src: url("../../assets/fonts/wenkai-gb-medium.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    unicode-range: U+2E80-303F, U+3200-33FF, U+3400-4DBF, U+4E00-9FFF,
                   U+F900-FAFF, U+FE30-FE4F, U+FF00-FFEF;
  }
  :root {
    --bg: #0c0e12;
    --ink: #05070a;
    --border: #252a34;
    --text: #e6e9ef;
    --dim: #9aa4b5;
    --faint: #6b7484;
    --accent: #6696E6;
    --code-accent: #9B8FE8;
    --slate: #5B7196;
    --sans: "Segoe UI", -apple-system, system-ui, sans-serif;
    --serif: Georgia, "Times New Roman", serif;
    --mono: Consolas, ui-monospace, monospace;
  }
  html[lang^="zh"] {
    --sans: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    --serif: Georgia, "Times New Roman", "LXGW WenKai GB", "SimSun", serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 900px 420px at 50% -8%, rgba(102, 150, 230, 0.13), transparent 70%),
      var(--bg);
    font-family: var(--sans);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  /* Film sprockets — the site's .film trick scaled up: ink holes punched out
     of a faint strip. */
  .sprockets {
    position: absolute;
    left: 0;
    right: 0;
    height: 16px;
    background-size: 46px 16px;
    background-image: radial-gradient(circle at 23px 8px,
      var(--ink) 0 5px, rgba(255, 255, 255, 0.07) 6px, transparent 7px);
  }
  .sprockets.top { top: 14px; }
  .sprockets.bottom { bottom: 14px; z-index: 2; }

  .brand {
    margin-top: 78px;
    display: flex;
    align-items: center;
    gap: 16px;
    font: 650 40px/1 var(--sans);
    letter-spacing: 0.01em;
  }
  h1 {
    margin-top: 44px;
    font: 400 72px/1.15 var(--serif);
    text-align: center;
    letter-spacing: -0.01em;
  }
  h1 em.accent-agent { color: var(--accent); }
  h1 em.accent-code { color: var(--code-accent); }
  .sub {
    margin-top: 24px;
    font: 400 26px/1.4 var(--sans);
    color: var(--dim);
  }
  .meta {
    margin-top: 24px;
    font: 400 16px var(--mono);
    letter-spacing: 0.06em;
    color: var(--faint);
  }
  .meta b { color: var(--slate); font-weight: 400; }
  .shot {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 1020px;
    height: 158px;
    overflow: hidden;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    box-shadow:
      0 0 0 1px rgba(5, 7, 10, 0.8),
      0 -24px 80px rgba(102, 150, 230, 0.10),
      0 -10px 44px rgba(0, 0, 0, 0.55);
  }
  .shot img { width: 1020px; display: block; }
</style>
</head>
<body>
  <div class="sprockets top"></div>

    </svg>
    <span>WeftCut</span>
  </div>

  <h1 data-en>Cut with your <em class="accent-agent">agent</em> and <em class="accent-code">code</em></h1>
  <h1 data-zh hidden>通过<em class="accent-agent">智能体</em>与<em class="accent-code">代码</em>完成剪辑</h1>

  <p class="sub" data-en>Free &amp; open source — connect Claude, Cursor, or any MCP client</p>
  <p class="sub" data-zh hidden>免费开源 — 接入 Claude、Cursor 或任意 MCP 客户端</p>

  <p class="meta" data-en><b>weftcut.com</b>&ensp;·&ensp;MIT&ensp;·&ensp;macOS · Windows · Linux</p>
  <p class="meta" data-zh hidden><b>weftcut.com/zh</b>&ensp;·&ensp;MIT&ensp;·&ensp;macOS · Windows · Linux</p>

  <div class="shot"><img src="../../assets/shots/editor-hero.webp" alt="" /></div>

  <div class="sprockets bottom"></div>

<script>
  if (new URLSearchParams(location.search).get("lang") === "zh") {
    document.documentElement.lang = "zh-Hans";
    for (const el of document.querySelectorAll("[data-en]")) el.hidden = true;
    for (const el of document.querySelectorAll("[data-zh]")) el.hidden = false;
  }
</script>
</body>
</html>
